<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>蜘蛛英雄爸爸 ★ 生日補發版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b1d2e; --paper:#fff6e3; --pink:#ff6b8b; --red:#d94f6b; --yellow:#f2c84b; --green:#6cbf4b; --blue:#5aa0e0;
    --zh:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#1d1424;color:var(--paper);font-family:var(--zh);overflow:hidden;
    -webkit-user-select:none;user-select:none}
  body{display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 20% 10%,#3a2440 0,transparent 40%),
      radial-gradient(circle at 80% 90%,#2c2048 0,transparent 45%),#1d1424}
  .px{font-family:"Press Start 2P",monospace}
  #app{display:flex;flex-direction:column;align-items:center;gap:6px}
  #hud{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--ink);
    box-shadow:0 0 0 3px #4a3550, 0 0 0 6px var(--ink);margin-top:6px}
  #lives{display:flex;gap:3px;min-width:66px}
  #lives img{width:20px;height:18px;image-rendering:pixelated}
  #lives img.off{filter:grayscale(1) brightness(.45)}
  #prog{display:flex;align-items:center;gap:6px;flex:1;font-weight:700;font-size:13px}
  #bar{flex:1;height:12px;background:#4a3550;box-shadow:inset 0 0 0 2px #1d1424;min-width:60px}
  #barFill{height:100%;width:0;background:linear-gradient(#ffd56b,#f08a3c);transition:width .2s steps(4)}
  #progNum{font-size:9px;color:var(--yellow);min-width:44px;text-align:right}
  #mute{background:#4a3550;color:var(--paper);border:0;width:30px;height:26px;font-size:15px;cursor:pointer;
    box-shadow:inset -2px -2px 0 #2b1d2e}
  #stage{position:relative;touch-action:none;box-shadow:0 0 0 3px #4a3550,0 0 0 6px var(--ink),0 12px 40px #0008;overflow:hidden}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:18px;gap:12px}
  .hidden{display:none!important}
  .dim{background:rgba(29,20,36,.72)}
  .title{font-size:28px;font-weight:900;line-height:1.25;color:#fff;letter-spacing:2px;
    text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),3px 3px var(--ink),-3px 3px var(--ink),3px -3px var(--ink),-3px -3px var(--ink),0 6px #c9405c,3px 6px var(--ink),-3px 6px var(--ink)}
  .title .t2{color:var(--yellow)}
  .sub{font-size:10px;color:var(--yellow);text-shadow:2px 2px var(--ink);line-height:1.8}
  .panel{background:var(--paper);color:var(--ink);padding:12px 14px;font-weight:700;font-size:14px;line-height:1.7;
    box-shadow:0 0 0 3px var(--ink),6px 6px 0 3px #0006;max-width:92%}
  .legend{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;text-align:left;font-size:13px}
  .legend .icons{display:flex;gap:4px;align-items:center}
  .legend img{height:22px;image-rendering:pixelated}
  .btn{font-family:var(--zh);font-weight:900;font-size:17px;color:#fff;background:var(--red);border:0;padding:12px 26px;cursor:pointer;
    box-shadow:0 0 0 3px var(--ink),inset -4px -4px 0 #a63452,inset 4px 4px 0 #ff8aa3;letter-spacing:2px}
  .btn:active{transform:translateY(2px);box-shadow:0 0 0 3px var(--ink),inset 4px 4px 0 #a63452}
  .btn.alt{background:#5aa0e0;box-shadow:0 0 0 3px var(--ink),inset -4px -4px 0 #3a6fa8,inset 4px 4px 0 #8cc4f5}
  .blink{animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .bob{animation:bob 1.6s steps(4) infinite}
  @keyframes bob{50%{transform:translateY(-6px)}}
  .bubble{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:#fff;color:var(--ink);font-weight:900;
    font-size:14px;padding:5px 9px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;
    box-shadow:0 0 0 3px var(--ink)}
  .bubble:after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-5px;border:6px solid transparent;border-top-color:var(--ink)}
  .bubble.show{opacity:1}
  #dialog{position:absolute;left:8px;right:8px;top:34%;background:var(--ink);color:var(--paper);padding:12px 14px 22px;
    font-size:15px;font-weight:700;line-height:1.65;min-height:84px;box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink)}
  #dialog .who{color:var(--yellow)}
  #dialog .next{position:absolute;right:10px;bottom:4px;font-size:10px;color:var(--yellow)}
  #hint{position:absolute;left:0;right:0;top:10px;text-align:center;font-weight:900;font-size:16px;color:#fff;pointer-events:none;
    text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink)}
  #card .letter{background:var(--paper);color:var(--ink);text-align:left;padding:14px 16px 12px;max-height:62%;overflow:auto;width:100%;
    box-shadow:0 0 0 3px var(--ink),0 0 0 7px var(--pink),0 0 0 10px var(--ink);font-size:14px;line-height:1.7;font-weight:600;
    -webkit-user-select:text;user-select:text}
  #card .letter h2{margin:0 0 6px;font-size:19px;color:var(--red);text-align:center}
  #card .stats{font-size:12px;color:#7a5a6e;text-align:center;margin-top:8px;line-height:1.6}
  #card .caret{display:inline-block;width:8px;height:15px;background:var(--red);vertical-align:-2px;animation:blink 1s steps(2) infinite}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .shake{animation:shake .3s linear}
  @keyframes shake{25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}
  .pbub{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:#fff;color:var(--ink);font-weight:900;font-size:14px;
    padding:5px 9px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:0 0 0 3px var(--ink);z-index:3}
  .pbub.show{opacity:1}
  .photo img{width:100%;display:block;margin-top:14px;box-shadow:0 0 0 3px var(--ink)}
  .photo div{text-align:center;font-size:13px;color:#7a5a6e;margin-top:8px}
  .tip{font-size:12px;font-weight:900;color:#fff;text-shadow:2px 2px var(--ink);margin-top:-4px}
  #backCard{position:absolute;left:50%;top:62px;transform:translateX(-50%);z-index:3}
</style>
</head>

<div id="app">
  <div id="hud">
    <div id="lives"></div>
    <div id="prog"><span>蜘蛛</span><div id="bar"><div id="barFill"></div></div><span id="progNum" class="px">0/25</span></div>
    <button id="mute" title="音效開關">♪</button>
  </div>
  <div id="stage">
    <canvas id="c" width="120" height="180"></canvas>
    <div id="bubble" class="bubble"></div><div id="bubble2" class="bubble"></div>
    <div id="hint"></div>
    <div id="petBubble" class="pbub"></div>
    <button class="btn hidden" id="backCard">📩 回到信件</button>

    <div id="title" class="screen">
      <div class="title bob" style="font-size:25px">蜘蛛英雄<br><span class="t2">爸爸出動！</span></div>
      <div class="sub px">★ 8/10 BIRTHDAY ★</div>
      <div class="sub" style="margin-top:-8px;font-weight:900">（遲到的補發版）</div>
      <div class="panel">
        <div style="margin-bottom:8px;font-size:13px">樓梯間竟然到處都是蜘蛛！</div>
        <div class="legend">
          <div class="icons" id="lgGood"></div><div>點一下就掃掉<br><span style="font-size:11px;color:#a06">金蜘蛛一隻抵三隻</span></div>
          <div class="icons" id="lgBad"></div><div>大隻的要點兩下</div>
          <div class="icons" id="lgHeart"></div><div>點愛心氣球補血</div>
        </div>
        <div style="margin-top:8px;font-size:13px">⚠️ 別讓蜘蛛垂到兒子面前！</div>
      </div>
      <button class="btn" id="startBtn">英雄出動！</button>
    </div>

    <div id="over" class="screen dim hidden">
      <div class="title" style="font-size:24px">哎呀！<br>兒子嚇壞了</div>
      <div class="panel" id="overMsg"></div>
      <button class="btn" id="retryBtn">再來一次</button>
    </div>

    <div id="dialog" class="hidden"><span id="dlgText"></span><span class="next blink px">▼</span></div>

    <div id="card" class="screen dim hidden">
      <div class="letter"><h2 id="cardTitle"></h2><div id="cardText"></div><div class="stats" id="cardStats"></div></div>
      <div class="row">
        <button class="btn alt" id="againBtn">再玩一次</button>
        <button class="btn" id="replayBtn">再唱一次 ♪</button>
      </div>
      <button class="btn alt" id="findDogBtn">🐶 找豆豆玩</button>
      <div class="tip">💡 點「找豆豆玩」，連點豆豆 5 下有驚喜，<br>也可以點點 Happy 喔！</div>
    </div>
  </div>
</div>

/* tiny 3x5 pixel font */
const FONT = {
  '0':["111","101","101","101","111"], '1':["010","110","010","010","111"], '2':["111","001","111","100","111"],
  '3':["111","001","111","001","111"], '4':["101","101","111","001","001"], '5':["111","100","111","001","111"],
  '6':["111","100","111","101","111"], '7':["111","001","010","010","010"], '8':["111","101","111","101","111"],
  '9':["111","101","111","001","111"], '+':["000","010","111","010","000"], '-':["000","000","111","000","000"],
  '/':["001","001","010","100","100"], '!':["010","010","010","000","010"], 'F':["111","100","110","100","100"], ' ':["000","000","000","000","000"],

function pxText(str, x, y, color, s = 1, outline) {
  str = String(str);
  if (outline) { for (const [dx, dy] of [[-1,0],[1,0],[0,-1],[0,1]]) pxText(str, x + dx * s, y + dy * s, outline, s); }
  ctx.fillStyle = color;
  for (let c = 0; c < str.length; c++) {
    const g = FONT[str[c]] || FONT[' '];
    for (let j = 0; j < 5; j++) for (let i = 0; i < 3; i++) if (g[j][i] === '1') ctx.fillRect(x + (c * 4 + i) * s, y + j * s, s, s);
  }
}
const pxW = (str, s = 1) => (String(str).length * 4 - 1) * s;

/* ============================================================

   ============================================================ */
let AC = null, master = null, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.22; master.connect(AC.destination); } catch (e) { AC = null; }
}
function tone(freq, dur, type = 'square', vol = 0.3, when = 0, slide = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);

}
function noise(dur, vol = 0.3, when = 0, freq = 1200) {
  if (!AC || muted) return;

  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;

  src.connect(f); f.connect(g); g.connect(master); src.start(t);
}
function nf(n) { const m = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 }; let s = m[n[0]]; if (n[1] === '#') s++; const o = +n[n.length - 1]; return 440 * 2 ** (((o + 1) * 12 + s - 69) / 12); }
const SFX = {
  catch() { tone(988, .07, 'square', .22); tone(1319, .09, 'square', .2, .06); },
  hurt() { tone(220, .3, 'sawtooth', .28, 0, -150); noise(.15, .2, 0, 600); },
  heart() { ['C5','E5','G5','C6'].forEach((n, i) => tone(nf(n), .1, 'square', .2, i * .06)); },
  win() { ['C5','E5','G5','C6','G5','C6'].forEach((n, i) => tone(nf(n), .14, 'square', .22, i * .1)); },
  over() { ['G4','F4','E4','C4'].forEach((n, i) => tone(nf(n), .22, 'triangle', .35, i * .18)); },
  swish() { noise(.12, .22, 0, 2500); },
  thud() { tone(160, .08, 'square', .25, 0, -60); noise(.06, .15, 0, 800); },
  boop() { tone(988, .05, 'square', .15); tone(1319, .06, 'square', .12, .05); },
  bark() { tone(560, .09, 'sawtooth', .3, 0, -260); tone(500, .13, 'sawtooth', .3, .16, -280); },
  blip() { tone(660, .03, 'square', .08); },
  blow() { noise(.35, .35, 0, 900); tone(300, .2, 'sine', .08, 0, -150); },
  ding() { tone(nf('E6'), .5, 'triangle', .3); tone(nf('C6'), .6, 'triangle', .25, .12); },
};
const HBD = [['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
             ['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
             ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],
             ['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',3]];
const HBD_BASS = [['C3',3],['G2',3],['G2',3],['C3',3],['C3',3],['F2',3],['C3',1.5],['G2',1.5],['C3',3]];
function playHBD() {
  if (!AC || muted) return;
  const beat = .36; let t = .1;
  for (const [n, b] of HBD) { tone(nf(n), b * beat * .95, 'square', .2, t); t += b * beat; }
  let tb = .1 + 1 * beat; // pickup
  for (const [n, b] of HBD_BASS) { tone(nf(n), b * beat * .9, 'triangle', .35, tb); tb += b * beat; }
}
// light BGM during play
const BGM = { timer: null, step: 0, next: 0 };
const BGM_MEL = ['C5',null,'E5','G5','A5',null,'G5','E5','F5',null,'A5','F5','E5','D5','C5',null,
                 'D5',null,'F5','A5','G5',null,'E5','C5','D5','E5','F5','D5','C5',null,null,null];
const BGM_BASS = ['C3','G3','A2','E3','F2','C3','G2','G3'];
function bgmStart() {
  if (!AC) return; bgmStop(); BGM.step = 0; BGM.next = AC.currentTime + .05;
  BGM.timer = setInterval(() => {
    if (!AC) return;
    const st = .15;
    while (BGM.next < AC.currentTime + .25) {
      const when = BGM.next - AC.currentTime, i = BGM.step % 32;
      if (!muted) {
        const n = BGM_MEL[i]; if (n) tone(nf(n), st * .9, 'square', .07, when);
        if (i % 4 === 0) tone(nf(BGM_BASS[(i / 4) | 0]), st * 3.5, 'triangle', .18, when);
        if (i % 2 === 1) noise(.03, .04, when, 6000);
      }
      BGM.step++; BGM.next += st;
    }

}

function spawn() {
  const easy = S.fails >= 2, prog = S.caught / CONFIG.goal, r = Math.random();
  if (r < .05 && S.lives < 3) {
    S.balloons.push({ x: 12 + Math.random() * 96, y: H + 4, vy: -(18 + Math.random() * 6), ph: Math.random() * 6 });
    return;
  }
  let type = 'spider', hp = 1;
  if (r < .11) type = 'gold';
  else if (r < .11 + (easy ? .1 : .14) + prog * .14) { type = 'big'; hp = 2; }
  const spr = sprite(type);
  let x = 0;
  for (let k = 0; k < 6; k++) {
    x = 8 + Math.random() * (W - 16);
    if (!S.spiders.some(s => s.state === 'down' && s.y < 50 && Math.abs(s.x - x) < 16)) break;
  }
  const base = (easy ? 10 : 12) + prog * (easy ? 9 : 14) + Math.random() * 5;
  S.spiders.push({
    type, hp, x, y: CEIL - spr.height, w: spr.width, h: spr.height,
    vy: type === 'big' ? base * .75 : type === 'gold' ? base * 1.35 : base,
    pause: 0, ph: Math.random() * 6, hit: 0, state: 'down', dir: 1,
  });
}

function addParts(x, y, colors, n = 8, spd = 40, up = 30) {
  for (let i = 0; i < n; i++) S.parts.push({ x, y, vx: (Math.random() - .5) * spd * 2, vy: -Math.random() * up - 10, life: .5 + Math.random() * .3, c: pick(colors), g: 90 });
}

}

        : `${CONFIG.hero}：別怕！爸爸再來一次！<br><span style="font-size:12px;color:#a06">已經抓了 ${S.caught} 隻，${S.caught >= CONFIG.goal * .6 ? '差一點點！' : '再加油！'}</span>`;

function jarPos() {
  const d = S.dad; return { x: Math.round(d.x) + 9, y: FLOOR + 2 - 20 + 8 };
}
function tapAt(p) {
  // balloons first
  for (let i = S.balloons.length - 1; i >= 0; i--) {
    const b = S.balloons[i];
    if (Math.hypot(b.x - p.x, b.y + 4 - p.y) < 11) {
      S.balloons.splice(i, 1);
      S.lives = Math.min(3, S.lives + 1); setLives(); SFX.heart(); say('dad', pick(CONFIG.quotes.heart), 1.1);
      addParts(b.x, b.y + 4, ['#ff6b8b','#ffffff'], 14);
      S.pops.push({ x: b.x, y: b.y - 4, t: 0, txt: '+1', c: '#ff6b8b' });
      return;
    }
  }
  let best = null, bd = 1e9;
  for (const s of S.spiders) {
    if (s.state !== 'down') continue;
    const d = Math.hypot(s.x - p.x, s.y + s.h / 2 - p.y);
    if (d < bd) { bd = d; best = s; }
  }
  const R = best ? (best.type === 'big' ? 15 : 12) : 0;
  if (!best || bd > R) { addParts(p.x, p.y, ['#b9c4cf','#ffffff'], 4, 20, 10); return; }
  S.dad.tx = clamp(p.x - 10, 10, 78); S.dad.swing = .3; S.dad.target = { x: best.x, y: best.y + best.h / 2 }; SFX.swish();
  if (best.hp > 1) {
    best.hp--; best.hit = .35; SFX.thud();
    addParts(best.x, best.y + best.h / 2, ['#3b2a3a','#ffffff'], 6);
    return;
  }
  S.spiders.splice(S.spiders.indexOf(best), 1);
  const pts = best.type === 'gold' ? 3 : 1;
  S.caught += pts; S.swept++; setProg(); SFX.catch();
  if (best.type === 'gold') { SFX.heart(); say('dad', CONFIG.quotes.gold, 1.3); }
  else if (Math.random() < .3 && bubbles.dad.t <= 0) say('dad', pick(CONFIG.quotes.catch), 1.1);
  addParts(best.x, best.y + best.h / 2, best.type === 'gold' ? ['#f2c84b','#ffe9a8','#ffffff'] : ['#f2c84b','#ffffff'], 8);
  S.pops.push({ x: best.x, y: best.y - 4, t: 0, txt: '+' + pts, c: '#f2c84b' });
  S.flying.push({ type: best.type, sx: best.x, sy: best.y, t: 0, dir: best.x >= S.dad.x ? 1 : -1, spin: 0 });
  if (S.caught >= CONFIG.goal) { S.winT = .6; S.mode = 'win'; bgmStop(); }
}

let storyIdx = 0, typing = null, typedFull = '';
function typeInto(el, html, speed = 38, done) {

    const tk = tokens[i++]; out += tk; el.innerHTML = out;
    if (tk[0] !== '<' && tk !== ' ' && i % 2 === 0) SFX.blip();
  }, speed);
}

/* ---------- input ---------- */
function toLocal(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; }

  else if (S.mode === 'cake') { initAudio(); if (!petAt(toLocal(e))) blow(); }

});

/* ============================================================
   Update
   ============================================================ */
function update(dt) {
  S.t += dt;
  const d = S.dad, c = S.client;
  if (S.mode === 'cake' || S.mode === 'card') d.tx = 102;
  const dx = d.tx - d.x, maxV = 90 * dt;
  d.moving = Math.abs(dx) > .6;
  d.x += clamp(dx * Math.min(1, dt * 10), -maxV, maxV);
  if (d.moving) d.walk += dt;
  if (d.swing > 0) d.swing -= dt;
  if (c.scare > 0) c.scare -= dt;
  if (c.leaving && c.show) { c.x += 40 * dt; if (c.x > W + 12) c.show = false; }

  for (const b of Object.values(bubbles)) if (b.t > 0) { b.t -= dt; if (b.t <= 0) b.el.classList.remove('show'); }
  placeBubbles();

  if (S.mode === 'play') {
    S.elapsed += dt; S.spawnT -= dt;

  for (let i = S.spiders.length - 1; i >= 0; i--) {
    const s = S.spiders[i];

      if (S.mode !== 'play') continue;

    const b = S.balloons[i]; b.y += b.vy * dt; b.ph += dt * 2; b.x += Math.sin(b.ph) * 6 * dt;
    if (b.y < -16) S.balloons.splice(i, 1);

  for (let i = S.flying.length - 1; i >= 0; i--) { const f = S.flying[i]; f.t += dt / .4; if (f.t >= 1) S.flying.splice(i, 1); }
  for (let i = S.parts.length - 1; i >= 0; i--) { const p = S.parts[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; if (p.life <= 0) S.parts.splice(i, 1); }
  for (let i = S.pops.length - 1; i >= 0; i--) { const p = S.pops[i]; p.t += dt; if (p.t > .7) S.pops.splice(i, 1); }
  for (let i = S.confetti.length - 1; i >= 0; i--) { const q = S.confetti[i]; q.y += q.vy * dt; q.ph += dt * 4; if (q.y > H + 4) S.confetti.splice(i, 1); }
  for (const k of S.candles) if (k.smoke > 0) k.smoke -= dt;
  if (S.shake > 0) S.shake -= dt;
}

}

$('findDogBtn').onclick = () => {
  $('card').classList.add('hidden'); $('backCard').classList.remove('hidden'); PET.dogN = 0;
  hint.innerHTML = '連點豆豆 5 下試試看！🐶<br><span style="font-size:13px">也可以點點 Happy，摸摸牠 ♥</span>';
};
$('backCard').onclick = () => { $('backCard').classList.add('hidden'); $('card').classList.remove('hidden'); hint.textContent = ''; };

function draw() {
  ctx.save();
  if (S.shake > 0) ctx.translate(Math.round((Math.random() - .5) * 3), Math.round((Math.random() - .5) * 3));
  drawRoom();
  if (S.mode === 'cake' || S.mode === 'card') {
    ctx.fillStyle = 'rgba(40,20,50,.35)'; ctx.fillRect(0, 0, W, H);
    drawCake();
  }
  if (S.mode === 'title') {
    [[22, 0], [60, 1.5], [102, 3]].forEach(([x, p], i) => {
      const y = 70 + Math.sin(S.t * 1.5 + p) * 10, t = i === 1 ? 'gold' : 'spider';
      drawThreadSpider({ type: t, x, y, w: sprite(t).width, h: sprite(t).height, state: 'down', ph: S.t * 6 + p, hit: 0 });
    });
  }
  for (const s of S.spiders) drawThreadSpider(s);
  drawPeople();
  drawFx();
  ctx.restore();
}

/* ============================================================
   Loop
   ============================================================ */
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!document.hidden) { update(dt); draw(); }
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) bgmStop(); else if (S.mode === 'play' && AC) bgmStart(); last = performance.now(); });
resize();
requestAnimationFrame(loop);
</script>
